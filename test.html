<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YouTube API Test</title>
    <style>
        body {
            font-family: Arial;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }

        img {
            max-width: 320px;
            display: block;
            margin-top: 15px;
        }

        pre {
            background: #f4f4f4;
            padding: 15px;
            overflow: auto;
        }
    </style>
</head>

<body>

<h2>YouTube Downloader API Test</h2>

<input
    id="url"
    type="text"
    placeholder="Paste YouTube URL here"
>

<button onclick="getInfo()">Get Video Info</button>

<div id="result"></div>

<script>

const API_URL = "https://youtube-downloader-api-m2ck.onrender.com";

async function getInfo() {

    const url = document.getElementById("url").value.trim();
    const result = document.getElementById("result");

    if (!url) {
        alert("YouTube URL paste karo");
        return;
    }

    result.innerHTML = "Loading...";

    try {

        const response = await fetch(API_URL + "/info", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                url: url
            })
        });

        const data = await response.json();

        if (!data.success) {
            result.innerHTML =
                "<h3>Error</h3><pre>" +
                JSON.stringify(data, null, 2) +
                "</pre>";
            return;
        }

        result.innerHTML = `
            <h3>${escapeHtml(data.title || "")}</h3>

            <p>
                <b>Channel:</b>
                ${escapeHtml(data.channel || "")}
            </p>

            <p>
                <b>Duration:</b>
                ${data.duration || 0} seconds
            </p>

            <p>
                <b>Available Qualities:</b>
                ${data.qualities.join(", ")}
            </p>

            ${
                data.thumbnail
                ? `<img src="${data.thumbnail}">`
                : ""
            }

            <h4>Full API Response</h4>

            <pre>${escapeHtml(
                JSON.stringify(data, null, 2)
            )}</pre>
        `;

    } catch (error) {

        result.innerHTML =
            "<h3>Connection Error</h3><pre>" +
            escapeHtml(error.toString()) +
            "</pre>";
    }
}

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
